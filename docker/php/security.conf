# Apache security settings.
# Installed as conf-enabled/zz-security.conf, so it is loaded after
# Debian's own security.conf and overrides its values.

# Do not reveal the Apache version and OS in headers and error pages
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# No directory listings (e.g. /assets/js/)
<Directory /var/www/html/public>
    Options -Indexes
</Directory>

# Browser must not guess content types (e.g. treat a JSON response as HTML)
Header always set X-Content-Type-Options "nosniff"

# The site must not be embedded in frames on other sites (clickjacking)
Header always set X-Frame-Options "DENY"

# Send only the origin, not the full URL, to other sites
Header always set Referrer-Policy "strict-origin-when-cross-origin"

# Browser features the app never uses
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

# Content Security Policy: only our own files and the two CDNs may be loaded.
# - no inline scripts: injected <script> tags would not run (XSS protection)
# - style-src 'unsafe-inline': Chart.js and Highcharts set inline styles
# - img-src data: blob:: Highcharts creates images in the browser for the PNG export
# - connect-src 'self': AJAX only to our own API
Header always set Content-Security-Policy "default-src 'self'; script-src 'self' https://code.jquery.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Strict-Transport-Security (HSTS) is only useful with HTTPS,
# so it belongs to the production server with a TLS certificate, not to this local setup.
